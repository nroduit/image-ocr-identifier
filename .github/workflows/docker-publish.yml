name: Docker publish

# Publishing only happens for the canonical history: pushes to main and version
# tags. Pull requests and feature branches never build or push an image.
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nroduit/image-ocr-identifier

jobs:
  publish:
    name: Build and push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU image: default tags (main, vX.Y.Z, latest).
          - variant: cpu
            dockerfile: docker/Dockerfile
            flavor: ""
          # GPU image: same tags with a -gpu suffix (main-gpu, vX.Y.Z-gpu,
          # latest-gpu).
          - variant: gpu
            dockerfile: docker/Dockerfile.gpu
            flavor: "suffix=-gpu,onlatest=true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: ${{ matrix.flavor }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Both Dockerfiles pin FROM --platform=linux/amd64 (paddlepaddle only
          # ships x86_64 Linux wheels), so only amd64 is built.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache per variant so CPU and GPU layers don't collide.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}